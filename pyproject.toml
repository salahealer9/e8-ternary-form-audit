[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e8-ternary-form-audit"
version = "1.0.0"
description = "Exact sparse realization and reproducibility audit of the E8 Cartan 3-form."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Salah-Eddin Gherbi" },
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]